# /etc/boot-service/config.yaml
#
# =============================================================================
# Boot‑Service - Example Configuration
# =============================================================================
#
# This file serves as a reference that users can copy, uncomment, and edit for the
# options they need.  All keys shown use the service's default values.  Each option
# lists the flag (--flag-name) and the environment variable (BOOT_SERVICE_...)
# that can be used to override it.
#
# -------------------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------------------

# Port to listen on
#
# Default: 8080
# Flag:    --port
# Env var: BOOT_SERVICE_PORT
port: 8080

# Host/IP address to bind to
#
# Default: 0.0.0.0 (i.e. all interfaces)
# Flag:    --host
# Env var: BOOT_SERVICE_HOST
host: "0.0.0.0"

# HTTP request read timeout, in seconds
#
# Default: 30
# Flag:    --read-timeout
# Env var: BOOT_SERVICE_READ_TIMEOUT
#read_timeout: 30

# HTTP request write timeout, in seconds
#
# Default: 30
# Flag:    --write-timeout
# Env var: BOOT_SERVICE_WRITE_TIMEOUT
#write_timeout: 30

# HTTP connection idle timeout, in seconds
#
# Default: 120
# Flag:    --idle-timeout
# Env var: BOOT_SERVICE_IDLE_TIMEOUT
#idle_timeout: 120

# Enable TokenSmith‑based authentication.  When true, the service expects a
# TokenSmith URL and will obtain service‑to‑service tokens for downstream calls.
#
# Flag:    --enable-auth
# Env var: BOOT_SERVICE_ENABLE_AUTH
enable_auth: false

# Enable Prometheus metrics collection and expose the /metrics endpoint.
#
# Flag:    --enable-metrics
# Env var: BOOT_SERVICE_ENABLE_METRICS
enable_metrics: false

# Enable the legacy BSS‑compatible boot API (/boot/v1).
#
# Flag:    --enable-legacy-api
# Env var: BOOT_SERVICE_ENABLE_LEGACY_API
enable_legacy_api: false

# Port on which the Prometheus metrics endpoint listens.
# Separate from the main service port for security isolation.
#
# Flag:    --metrics-port
# Env var: BOOT_SERVICE_METRICS_PORT
metrics_port: 9090

# -------------------------------------------------------------------------
# Storage Configuration
# -------------------------------------------------------------------------

# Directory used by the file‑based storage backend
#
# Default: ./data
# Flag:    --data-dir
# Env var: BOOT_SERVICE_DATA_DIR
data_dir: "./data"

# Storage backend type
#
# Values:
#   - "file"      - stores data on the local filesystem
#   - "database"  - use a database backend
# Default: "file"
# Flag:    --storage-type
# Env var: BOOT_SERVICE_STORAGE_TYPE
storage_type: "file"

# -------------------------------------------------------------------------
# TokenSmith Configuration (Optional - for dynamic authentication)
# -------------------------------------------------------------------------

# Base URL of the TokenSmith service.
# Supports both mTLS and bootstrap‑token authentication modes.
#
# Example: https://tokensmith.example.com
# Flag:    --tokensmith-url
# Env var: BOOT_SERVICE_TOKENSMITH_URL
tokensmith_url: "http://tokensmith:8080"

# Bootstrap token used when the service cannot present a client certificate.
#
# Flag:    --tokensmith-bootstrap-token
# Env var: BOOT_SERVICE_TOKENSMITH_BOOTSTRAP_TOKEN
#tokensmith_bootstrap_token: ""

# Target downstream service name for which TokenSmith should issue a token.
#
# Default: "hsm"
# Flag:    --tokensmith-target-service
# Env var: BOOT_SERVICE_TOKENSMITH_TARGET_SERVICE
tokensmith_target_service: "hsm"

# Diagnostic hint: a comma‑separated list of scopes that the bootstrap token
# is allowed to request.
#
# Example: "boot:read,boot:write"
# Flag:    --tokensmith-bootstrap-policy-scopes-hint
# Env var: BOOT_SERVICE_TOKENSMITH_BOOTSTRAP_POLICY_SCOPES_HINT
#tokensmith_bootstrap_policy_scopes_hint: ""

# Number of seconds before a token's expiry when the service should attempt a
# refresh.  This avoids edge‑case failures when the token is about to expire.
#
# Flag:    --tokensmith-refresh-skew-sec
# Env var: BOOT_SERVICE_TOKENSMITH_REFRESH_SKEW_SEC
tokensmith_refresh_skew_sec: 120

# JWKS (JSON Web Key Set) endpoint for JWT validation.  If empty, the service
# will not attempt JWKS fetching and will rely on TokenSmith‑issued tokens.
#
# Flag:    --jwks-endpoint
# Env var: BOOT_SERVICE_JWKS_ENDPOINT
#jwks_endpoint: ""

# -------------------------------------------------------------------------
# Hardware State Manager (HSM) Configuration
# -------------------------------------------------------------------------

# URL of the Hardware State Manager service.  When set, the boot service will
# query HSM for node/BMC inventory and enable the FlexibleBootScriptController.
#
# Flag:    --hsm-url
# Env var: BOOT_SERVICE_HSM_URL
hsm_url: "http://smd:27779"

# Enable background synchronization with HSM.  When false, the service will
# not attempt periodic pulls from HSM.
#
# Flag:    --hsm-sync-enabled
# Env var: BOOT_SERVICE_HSM_SYNC_ENABLED
hsm_sync_enabled: true

# Interval, in minutes, at which the HSM sync worker runs.
#
# Flag:    --hsm-sync-interval
# Env var: BOOT_SERVICE_HSM_SYNC_INTERVAL
hsm_sync_interval: 5

# -------------------------------------------------------------------------
# Additional (Non‑Config‑File) Flags
# -------------------------------------------------------------------------
# The following flags are *persistent* (global) and are **not** represented in
# the YAML configuration, but they can still be used on the command line or via
# environment variables:
#
#   --config <path>   (env: BOOT_SERVICE_CONFIG)
#        Path to an alternative configuration file.
#
#   --help, --version, etc. are standard Cobra flags.

# =============================================================================
# End of example configuration.
# =============================================================================
