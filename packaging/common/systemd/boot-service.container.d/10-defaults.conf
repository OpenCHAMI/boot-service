[Container]
# SECRETS
Secret=%N-bootstrap-token,type=env,target=TOKENSMITH_BOOTSTRAP_TOKEN

# VOLUMES
Volume=/etc/openchami/configs/%N.yaml:/etc/%N/config.yaml:ro,Z
Volume=boot-service-data.volume:/app/data:rw,Z

# NETWORKS
Network=openchami-internal.network
HttpProxy=false

[Service]
ExecStartPre=/usr/sbin/tokensmith_bootstrap_token %N
